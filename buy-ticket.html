    <main class="ticket-main">
      <div class="container">
        <div class="ticket-shell">
          <section class="ticket-panel ticket-panel--form">
            <p class="ticket-panel__eyebrow">Booking</p>
            <h1 class="title ticket-panel__title">Buy ticket</h1>

            <form class="ticket-form" id="ticket-form">
              <div class="ticket-form__group">
                <label for="visit-date">Visit date</label>
                <input id="visit-date" name="visit-date" type="date" required />
              </div>

              <div class="ticket-form__group">
                <label for="ticket-type">Ticket type</label>
                <select id="ticket-type" name="ticket-type">
                  <option value="adult">Adult — $20</option>
                  <option value="student">Student — $12</option>
                  <option value="family">Family — $42</option>
                  <option value="veteran">Veteran — $10</option>
                </select>
              </div>

              <div class="ticket-form__group">
                <label for="ticket-count">Quantity</label>
                <input id="ticket-count" name="ticket-count" type="number" min="1" max="10" value="1" required />
              </div>

              <div class="ticket-form__group">
                <label for="visitor-name">Visitor name</label>
                <input id="visitor-name" name="visitor-name" type="text" placeholder="Your full name" required />
              </div>

              <div class="ticket-form__group">
                <label for="visitor-email">Email</label>
                <input id="visitor-email" name="visitor-email" type="email" placeholder="you@email.com" required />
              </div>

              <button type="submit" class="action-button ticket-form__submit">Continue to payment</button>
            </form>
          </section>

          <aside class="ticket-panel ticket-panel--summary">
            <p class="ticket-panel__eyebrow">Order summary</p>
            <h2 class="title ticket-panel__subtitle">Selected visit</h2>

            <div class="ticket-summary">
              <div class="ticket-summary__row">
                <span>Ticket</span>
                <strong id="summary-ticket">Adult</strong>
              </div>
              <div class="ticket-summary__row">
                <span>Quantity</span>
                <strong id="summary-count">1</strong>
              </div>
              <div class="ticket-summary__row">
                <span>Price per ticket</span>
                <strong id="summary-unit">$20</strong>
              </div>
              <div class="ticket-summary__row ticket-summary__row--total">
                <span>Total</span>
                <strong id="summary-total">$20</strong>
              </div>
            </div>

            <div class="ticket-summary__note">
              Includes access to the current exhibitions and selected events.
            </div>
          </aside>
        </div>
      </div>
    </main>
